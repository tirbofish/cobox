<svg xmlns="http://www.w3.org/2000/svg" width="128" height="160" viewBox="0 0 128 160" role="img" aria-label="Cobox blob idle animation">
  <title>Cobox blob idle animation</title>
  <!-- The whole character gently breathes in place. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 1;0 -2;0 1" dur="3.2s" repeatCount="indefinite"/>

    <!-- Ground shadow makes the bob readable on a small display. -->
    <ellipse cx="64" cy="128" rx="31" ry="6" fill="#071016" opacity=".65">
      <animate attributeName="rx" values="31;27;31" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;.42;.65" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Customisable blob body. -->
    <path d="M24 91C20 72 27 51 43 43C58 35 76 38 90 47C104 56 108 75 103 94C98 113 82 123 63 123C43 123 28 111 24 91Z" fill="#7CFFB2">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M24 91C20 72 27 51 43 43C58 35 76 38 90 47C104 56 108 75 103 94C98 113 82 123 63 123C43 123 28 111 24 91Z;
                M22 90C18 70 27 49 44 42C59 35 78 39 92 49C105 59 108 77 102 95C96 114 81 125 62 124C41 123 26 110 22 90Z;
                M24 91C20 72 27 51 43 43C58 35 76 38 90 47C104 56 108 75 103 94C98 113 82 123 63 123C43 123 28 111 24 91Z"/>
    </path>

    <!-- Face. -->
    <g fill="#101820">
      <ellipse cx="47" cy="78" rx="5" ry="8">
        <animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;.42;.46;.50;1" dur="4.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="81" cy="78" rx="5" ry="8">
        <animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;.42;.46;.50;1" dur="4.8s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M57 94Q64 100 71 94" fill="none" stroke="#101820" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- A subtle shine gives the blob a living, fluid surface. -->
    <ellipse cx="42" cy="57" rx="8" ry="4" fill="#E8FFF1" opacity=".55" transform="rotate(-25 42 57)">
      <animate attributeName="opacity" values=".35;.7;.35" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
